name: CI

on:
  push:
    branches: [ master ]
  pull_request:

env:
  rgbds_version: v1.0.1

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout rgbds
        uses: actions/checkout@v6
        with:
          path: rgbds
          ref: ${{ env.rgbds_version }}
          repository: gbdev/rgbds
          persist-credentials: false

      - name: Install rgbds
        working-directory: rgbds
        run: |
          sudo apt-get update
          sudo apt-get install -yq bison libpng-dev pkg-config
          sudo make -j$(nproc) install

      - name: Remove rgbds
        run: |
          rm -rf rgbds

      - name: Compare
        if: ${{ github.repository_owner == 'pret' }}
        run: |
          make DEBUG=1 -j$(nproc) compare
          .github/checkdiff.sh

      - name: Make
        if: ${{ github.repository_owner != 'pret' }}
        run: |
          make -j$(nproc)
          .github/checkdiff.sh

      - name: Stage symbols for publication
        if: ${{ github.repository_owner == 'pret' && github.event_name == 'push' }}
        run: |
          mkdir -p "$RUNNER_TEMP/rom-symbols"
          cp -v *.sym *.map "$RUNNER_TEMP/rom-symbols/"

      - name: Retain same-run symbols for publication
        if: ${{ github.repository_owner == 'pret' && github.event_name == 'push' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rom-symbols-${{ github.sha }}
          path: ${{ runner.temp }}/rom-symbols
          if-no-files-found: error
          retention-days: 7

  publish-symbols:
    needs: build
    if: ${{ github.repository_owner == 'pret' && github.event_name == 'push' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout symbols
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: symbols
          ref: symbols
          persist-credentials: true

      - name: Retrieve same-run symbols
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rom-symbols-${{ github.sha }}
          path: symbols

      - name: Update symbols
        uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9
        with:
          cwd: "./symbols"
          add: "*.sym *.map"
          message: ${{ github.event.commits[0].message }}

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout rgbds
        uses: actions/checkout@v6
        with:
          path: rgbds
          ref: ${{ env.rgbds_version }}
          repository: gbdev/rgbds
          persist-credentials: false

      - name: Install rgbds
        working-directory: rgbds
        run: |
          brew install bison libpng pkg-config
          export PATH="$(brew --prefix bison)/bin:$PATH"
          sudo make -j$(sysctl -n hw.ncpu) install

      - name: Remove rgbds
        run: |
          rm -rf rgbds

      - name: Compare
        if: ${{ github.repository_owner == 'pret' }}
        run: |
          make DEBUG=1 -j$(sysctl -n hw.ncpu) compare
          .github/checkdiff.sh

      - name: Make
        if: ${{ github.repository_owner != 'pret' }}
        run: |
          make -j$(sysctl -n hw.ncpu)
          .github/checkdiff.sh

